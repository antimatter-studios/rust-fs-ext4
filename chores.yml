version: "3"
chore_min_version: 0.6.0

# THE CONTRACT THIS FILE EXISTS TO OWN.
#
# How to build rust-fs-ext4 is knowledge that belongs to rust-fs-ext4. It used to
# live in diskjockey/scripts/build-fs-*.sh — four scripts, 757 lines between
# them, byte-identical once you normalise the driver name, of which three
# lines per script were actually about the filesystem: the cargo invocation,
# the header name and the archive name.
#
# `staticlib` is the whole interface a consumer needs, AND IT TAKES NO
# OUTPUT DIRECTORY. It builds into this crate's own dist/; `chore artifact`
# prints the absolute path of that DIRECTORY, and a consumer copies its
# contents. Nothing outside this repo should know the target triple, the
# cargo profile, or where cargo puts things — and nothing outside it
# chooses where the output lands.
#
# `artifact` PRINTS A DIRECTORY, NOT A FILE. That is the one place this
# differs from rust-blk-probe, whose single binary lets its `artifact` name
# a file: this crate produces libfs_ext4.a AND the headers beside it, so
# there is no single path to name.
#
# THE TEST CONTRACT (the template the other filesystem repos copy; the
# harness README's "Consumer test contract" is the general form):
#
#   chore siblings     check out ../rust-fs-core and ../fs-linux-test-harness
#                      at their pinned refs
#   chore tools        install and verify what the HOST needs: ripgrep, and
#                      the VM (Vagrant, QEMU, KVM/HVF). NOT e2fsprogs
#   chore fixtures     build test-disks/*.img — kernel-made, so in the
#                      harness VM (vm:*)
#   chore test:unit    tests that need no tool, no fixture and no VM
#   chore test:images  tests that read a fixture but need no VM
#   chore test:oracle  the driver writes, e2fsprogs reads back (e2fsck -fn
#                      for consistency, debugfs for content and metadata)
#   chore test:kernel  the driver writes, THE REAL KERNEL reads back: our
#                      images loop-mounted by Linux in the guest
#   chore test:lwext4  A THIRD IMPLEMENTATION reads what we wrote, and we
#                      read what it wrote: lwext4, built in the guest
#   chore test:vm      the whole suite compiled and run INSIDE the guest
#   chore test         everything, exactly as CI runs it
#
# WHERE THINGS RUN, and why.
#
#   THE ORACLE TOOLS RUN IN THE GUEST, ALWAYS. e2fsprogs on a workstation
#   is whatever that machine has — a keg-only Homebrew formula on a Mac, a
#   distribution build on Linux, a different version per developer — and
#   on a Mac it is not the platform these images are for at all. One
#   Debian guest, one version, the same answers everywhere. There is no
#   host path to fall back to: tests/test_contract.rs fails the suite if a
#   test runs one here.
#
#   THE KERNEL ORACLES MOUNT IN THE GUEST, ALWAYS. A loop mount needs root
#   and an ext4 driver; the host has neither to spare.
#
#   THE LINUX TESTS RUN ON LINUX. On a Linux host that is this host, and
#   `chore test` compiles and runs them here. On a Mac nothing Linux-shaped
#   runs natively: `chore test` runs `test:vm` instead, which builds and
#   runs the same sources inside the guest.
#
# NOTHING SKIPS: a missing tool, fixture or VM fails the test that needed
# it, naming the task that provides it.
#
# QUIET BY DEFAULT, --verbose ON REQUEST, AND THE BUDGET IS A NUMBER.
#
#   A task prints a VERDICT: one line per tier, a final count, and the path
#   of the log holding everything else. A failure prints the excerpt.
#   `chore test -- --verbose` (or OUTPUT_BUDGET_VERBOSE=1) streams the whole run.
#
#   Nothing is thrown away: every tier's output goes to tmp/logs/<tier>.log
#   in full, including the per-call `[oracle vm]` evidence that `--show-output`
#   produces. What changed is where it is read from.
#
#   Each tier carries an OUTPUT BUDGET -- a line and a byte count that fails
#   the run (exit 65) when the tier prints more than it is allowed to, told
#   apart from a failing suite by its status. The budgets below are MEASURED,
#   on this arm64 KVM host, from the run recorded in pull request #257:
#
#     tier      measured          budget            headroom, and why
#     unit        530 /  31,331      700 /  42,000   ~30%: tests get added
#     images    1,065 /  44,731    1,400 /  60,000   ~30%
#     oracle    1,786 / 140,018    2,300 / 180,000   ~29%. --show-output is
#                                                    most of it, and it is
#                                                    the evidence, so it
#                                                    stays -- in the log.
#                                                    Re-measured on the x86_64
#                                                    CI job of PR #146, whose
#                                                    checked-recovery sweep adds
#                                                    170 lines / 21,576 bytes
#                                                    (141 [oracle vm] e2fsck calls)
#     kernel       52 /   2,855       80 /   4,000   ~50%: four tests, so
#                                                    one more is a big step
#     lwext4       57 /   4,366       80 /   6,000   ~40% / ~37%: eight tests
#                                                    and sixteen [oracle vm]
#                                                    lines, so one more
#                                                    compared fixture is a
#                                                    visible step
#     suite     1,989 /  93,373    2,500 / 125,000   ~25%
#     scripts      28 /   1,427       50 /   3,000   ~75%: three tests
#     wasm        127 /   5,302      170 /   8,000   ~25% / ~34%. Lines measured
#                                                    cold on arm64 macOS (no
#                                                    registry cache, no build;
#                                                    58 are crate downloads, as
#                                                    a first CI run after a
#                                                    Cargo.lock change prints);
#                                                    bytes in CI (PR #312: 113
#                                                    lines), whose longer paths
#                                                    and colour codes cost more
#     vm        2,090 /  99,544    2,700 / 135,000   ~30%. Measured in CI
#                                                    (suite-in-vm), which is
#                                                    a FIRST run: the guest
#                                                    build's per-crate lines
#                                                    are already in it
#
#   Raise one DELIBERATELY when a tier grows, the way the executed-test
#   floors are raised. A budget nobody can breach measures nothing, and
#   tests/scripts/test-output-budget.sh fails a tier that has none.
#
#   Why it is worth a task's while: a passing run that prints three thousand
#   lines hides the twenty that matter, and every reader pays for it --
#   a person scrolling, a CI log viewer, and an agent working here, which
#   re-reads its transcript on every step and so pays for one loud run many
#   times over. See the fs-linux-test-harness README, "Output: quiet by
#   default, --verbose on request".
vars:
  TRIPLE: aarch64-apple-darwin
  LIBNAME: fs_ext4

  # The sibling pins. One place, read by `chore siblings` and — through
  # that task — by CI. URL as well as ref: the family is not all in one
  # org, and a URL rebuilt from a repo name points at a repository that
  # does not exist for exactly the ones that are not.
  FS_CORE_URL: https://github.com/antimatter-studios/rust-fs-core.git
  # scripts/tier.sh reads scripts/output-budget.sh out of core. v0.2.11 is the
  # first release that packages it and v0.2.13 is the first that carries the
  # quiet-failure behaviour, so this pin cannot go back below v0.2.13 while
  # the tiers read the wrapper from core.
  FS_CORE_REF: v0.2.13
  LINUX_HARNESS_URL: https://github.com/antimatter-studios/fs-linux-test-harness.git
  LINUX_HARNESS_REF: v0.1.0

# The harness's consumer tasks, as `chore vm:<task>`. OPTIONAL because the
# harness is a sibling that `chore siblings` itself checks out: without
# it this file must still load far enough to run that task. Every task
# here that needs the VM says so when the harness is absent.
#
# No `dir:` — see the harness's vm.chores.yml: its tasks must run from
# this repository's root, where fs-linux-test-harness.toml is.
includes:
  vm:
    taskfile: ../fs-linux-test-harness/vm.chores.yml
    optional: true

# The reaper: any chore invocation stops a VM nothing else brought down
# (a killed `chore fixtures`, a script run by hand). Fails soft, and does
# nothing before the harness is checked out.
lifecycle:
  after_all:
    - '[ ! -x ../fs-linux-test-harness/scripts/vm.sh ] || ../fs-linux-test-harness/scripts/vm.sh reap'


tasks:
  siblings:
    desc: Check out the sibling repos this crate builds and tests against, at their pinned refs
    # init + fetch-by-ref rather than clone: a ref here may be a bare
    # commit, which `git clone --branch` cannot name. REFUSES TO MOVE A
    # DIRTY SIBLING — a checkout is destructive to uncommitted work.
    cmds:
      - |
        set -eu
        # SIBLINGS LIVE BESIDE THE MAIN TREE, NOT BESIDE THIS CHECKOUT.
        #
        # `../$name` was resolved from wherever the task ran, and a thread worktree
        # is not next to the main checkout -- it lives under the agent's own
        # directory. Measured on 2026-09-22 the same family resolved
        # ../rust-fs-core to THREE different places: beside the main checkouts,
        # beside the ntfs worktrees, and beside the diskjockey ones. One of those
        # was a day out of date and was winning silently for anything resolving
        # relatively.
        #
        # A sibling set is a property of the machine, not of a checkout. One copy
        # on disk is the whole point of siblings over submodules, and it holds only
        # if every checkout of every crate agrees where that copy is.
        # --git-common-dir names the main tree from a worktree AND from the main
        # checkout, so this answers the same from anywhere.
        #
        # --path-format=absolute is required, not tidiness: without it a main
        # checkout reports a bare `.git` and this resolves to `//$name`.
        common="$(git rev-parse --path-format=absolute --git-common-dir)"
        siblings_root="$(cd "$common/../.." && pwd)"
        printf '%s\t%s\t%s\n' \
          rust-fs-core          '{{.FS_CORE_URL}}'       '{{.FS_CORE_REF}}' \
          fs-linux-test-harness '{{.LINUX_HARNESS_URL}}' '{{.LINUX_HARNESS_REF}}' \
        | while IFS="$(printf '\t')" read -r name url ref; do
            dir="$siblings_root/$name"
            if [ ! -d "$dir/.git" ]; then
              echo "siblings: cloning $name at $ref"
              git init --quiet "$dir"
              git -C "$dir" remote add origin "$url"
              git -C "$dir" fetch --quiet origin "$ref"   # not --depth 1: merge-base needs history
              git -C "$dir" checkout --quiet FETCH_HEAD
              continue
            fi
            if [ -n "$(git -C "$dir" status --porcelain)" ]; then
              echo "siblings: $name has uncommitted changes -- refusing to move it." >&2
              exit 1
            fi
            git -C "$dir" fetch --quiet origin main "$ref"
            # THE PIN IS A FLOOR, NOT A TARGET, AND THE SIBLING STAYS ON A BRANCH.
            #
            # This used to compare HEAD with the pinned ref and check out the ref
            # whenever they differed, which had two consequences, both observed.
            #
            # It moved the checkout BACKWARDS. One copy of core is shared by every
            # crate on the machine, so the oldest pin in the family won: a sibling two
            # commits ahead was silently rewound to satisfy this repository.
            #
            # And checking out a tag DETACHES. Core was found detached and 52 commits
            # stale, four days after a `chore siblings` run put it there, because a
            # detached HEAD reads as a deliberate state and nothing complains about it.
            # On a branch, being behind shows up in `git status` the first time anyone
            # looks -- and a commit made in the sibling belongs to something.
            #
            # So: guarantee a FLOOR, and never move anyone off their branch.
            #
            # An earlier cut of this checked out main unconditionally, which is only a
            # little better than the detach it replaced. rust-fs-core was found on
            # release/v0.2.12 with an unpushed commit while a release was being cut;
            # checking out main would have taken it away mid-cut. The previous
            # revision of this task did worse to that same checkout on 2026-09-22 --
            # it rewound a shared core three weeks, to a September 6th commit.
            #
            # If the checkout already contains the pinned ref it is left exactly as it
            # is, on whatever branch that is. Only a checkout genuinely below the floor
            # is moved, and only by fast-forwarding a main that is already checked out.
            # Anything else is reported for a human, because this is one checkout
            # shared by every crate on the machine and not this task's to hijack.
            current="$(git -C "$dir" rev-parse --abbrev-ref HEAD)"
            if git -C "$dir" merge-base --is-ancestor "$ref" HEAD; then
              echo "siblings: $name at or ahead of $ref (on $current)"
            elif [ "$current" = "main" ] && git -C "$dir" merge --ff-only --quiet origin/main 2>/dev/null; then
              echo "siblings: $name fast-forwarded to $(git -C "$dir" rev-parse --short HEAD)"
            else
              echo "siblings: $name is on '$current' and below $ref; this task will not move it." >&2
              echo "          It is one checkout shared by every crate here -- move it yourself." >&2
              exit 1
            fi
          done

          # CARGO IS TOLD ABOUT THE CHECKOUT BY Cargo.toml, NOT BY A CONFIG
          # FILE WRITTEN HERE.
          #
          # An earlier cut of this task wrote a `paths` override into
          # .cargo/config.toml holding an ABSOLUTE path to the sibling, so the
          # manifest could name am-fs-core by version alone. It failed in the
          # one place this repository cannot afford to fail: `chore test:vm`
          # mounts this working tree into the guest at /repo, the override went
          # with it, and the host path it names does not exist inside the VM.
          #   error: failed to update path override
          #          `/home/runner/work/rust-fs-ext4/rust-fs-core`
          #          (defined in `/repo/.cargo/config.toml`)
          # -- run 35852463970, job 107154016599.
          #
          # A path INSIDE the repository is a path two machines have to agree
          # on, and these two do not. `path = "../rust-fs-core"` in Cargo.toml
          # is the answer both of them already have: on the host it is the
          # sibling this task pins, and in the guest it is /rust-fs-core, which
          # test:vm stages there for exactly this reason. It is also what every
          # other crate in this family declares.
          #
          # `version` beside the `path` is what gets published: cargo drops the
          # path when it packages, so the released crate depends on the
          # registry version and nobody downstream inherits our layout.

  tools:
    desc: "Install and verify what the HOST needs: ripgrep, and the VM the oracle tools live in"
    cmds: ['scripts/tools.sh']

  fixtures:
    desc: Build every test-disks/*.img fixture (kernel-made, in the fs-linux-test-harness VM)
    # Up to date while the recipe is unchanged and every image exists;
    # --force rebuilds. The VM comes down when the build ends, however
    # it ends (build-fixtures.sh sources the harness's vm-session.sh).
    #
    # THIS LIST AND IMAGES IN build-fixtures.sh MUST AGREE.
    sources:
      - test-disks/build-fixtures.sh
      - test-disks/guest-build-images.sh
      - scripts/vm-setup.sh
    generates:
      - test-disks/ext4-basic.img
      - test-disks/ext4-htree.img
      - test-disks/ext4-csum-seed.img
      - test-disks/ext4-no-csum.img
      - test-disks/ext4-deep-extents.img
      - test-disks/ext4-inline.img
      - test-disks/ext4-xattr.img
      - test-disks/ext4-acl.img
      - test-disks/ext4-largedir.img
      - test-disks/ext4-manyfiles.img
      - test-disks/ext4-whole-disk.img
    # A hung boot must not hold the VM and the machine-wide slot for ever.
    timeout: 60m
    on_timeout:
      - cmd: '../fs-linux-test-harness/scripts/vm.sh down || ../fs-linux-test-harness/scripts/vm.sh destroy'
    cmds: ['test-disks/build-fixtures.sh']

  test:unit:
    desc: 'Tests that need no tool and no fixture: the library, the binaries, and every tests/*.rs that reaches neither'
    # In the DEBUG profile, which is the point: overflow-checks are on
    # here and off in release, and EXPECT_OVERFLOW_CHECKS=1 arms
    # overflow_checks::the_build_the_gate_asked_to_check_does_check in
    # src/lib.rs to prove it. tests/ci_profile.rs checks that the CI
    # workflow still runs this task (the `unit` job).
    #
    # Which targets: scripts/test-targets.sh, derived from the tests
    # rather than listed here. CI runs this job with no fixtures present,
    # which is what proves the split.
    cmds:
      - 'EXPECT_OVERFLOW_CHECKS=1 scripts/tier.sh test:unit unit 700 42000 -- scripts/test.sh --locked $(scripts/test-targets.sh unit)'
      - 'scripts/test-floor.sh unit 440'

  # EVERY TIER SAYS HOW FEW TESTS STILL COUNT AS HAVING RUN IT (#271).
  #
  # `tier.sh` fails a tier that PRINTS more than its budget; nothing
  # failed a tier that printed almost nothing because it RAN almost
  # nothing. The tiers select their targets by grep in
  # `scripts/test-targets.sh`, so a helper renamed or a predicate edited
  # empties a selection — and `cargo test` with no matching target exits
  # 0, which `tier.sh` then reports as `ok (2 lines)`.
  #
  # EVERY FLOOR IS MEASURED, from the executed counts each floor call
  # printed in CI run 36310164119 (main at ff0911d, 2026-09-27; the
  # counts were the same in 36284844285 at abbb3db):
  #
  #   tier     executed   floor   where it ran
  #   unit        466      440    `unit` job, and both `test` jobs
  #   images      477      450    `test (aarch64, no KVM on this runner)`
  #   oracle      147      140    `test (x86_64, oracles in the VM)`
  #   kernel        4        3    `test (x86_64, oracles in the VM)`
  #   lwext4        8        7    `test (x86_64, oracles in the VM)`
  #   suite      1115     1060    `test (x86_64, oracles in the VM)`
  #   vm         1115     1060    `suite in the guest (the macOS path)`
  #
  # About 95% of the measurement (one below it for the two small tiers),
  # so merging two tests is not a failure and losing a test binary is.
  # A floor only ever goes up: raise it with the run that measured the
  # new count. tests/scripts/test-tier-floors.sh fails if a tier run
  # through tier.sh has no floor, or if a floor passes a tier that
  # executed one test.
  #
  # `scripts` has none: it prints a PASS line per shell test rather than
  # cargo's result lines, so the counter here would read zero for a tier
  # that ran everything.
  test:images:
    desc: 'The tests that read a fixture but need no VM — what a host without KVM can still run'
    # The tier CI's aarch64 job runs: GitHub's arm64 runners have no
    # /dev/kvm, so no VM can start there, and the oracle and kernel tiers
    # read the same images on every architecture anyway. Named as a tier
    # rather than skipped inside the tests, so what does not run there is
    # visible in the workflow rather than hidden in a green log.
    cmds:
      - 'scripts/tier.sh test:images images 1400 60000 -- scripts/test.sh --locked --release $(scripts/test-targets.sh images)'
      - 'scripts/test-floor.sh images 450'

  test:oracle:
    desc: 'The driver writes, e2fsprogs reads back — every tool call made inside the harness VM'
    # --show-output keeps what each passing oracle test checked (the
    # `[oracle vm]` lines: every tool invocation, where it ran and its
    # verdict), so a green run carries its evidence rather than a count.
    # It goes to tmp/logs/oracle.log, not the terminal -- the evidence is
    # kept, and reading it is a choice rather than a toll. `--verbose`
    # streams it live.
    #
    # NO `vm:up` HERE, deliberately. The first oracle call in each test
    # process brings the VM up (idempotent, milliseconds when it is
    # already running) and every later call rides one shared SSH
    # connection. Nothing holds it, so the `after_all` reaper stops it
    # when this invocation ends — one boot for the tier, and no VM left
    # behind by a run that was interrupted.
    cmds:
      - scripts/tools.sh --check
      - 'scripts/tier.sh test:oracle oracle 2300 180000 -- scripts/test.sh --locked --release $(scripts/test-targets.sh oracle) -- --show-output'
      - 'scripts/test-floor.sh oracle 140'

  test:kernel:
    desc: 'The driver writes, THE KERNEL reads back: our images loop-mounted by Linux in the guest'
    # The gap e2fsprogs cannot close: a volume it calls clean can still be
    # one Linux mounts differently. These tests write with the Rust API
    # and with the C ABI, mount read-only in the guest, and compare names,
    # sizes, modes, xattrs, ACLs and SHA-256 of contents against what was
    # written — plus the reverse direction, and a deliberate corruption
    # that must fail.
    cmds:
      - 'scripts/tier.sh test:kernel kernel 80 4000 -- scripts/test.sh --locked --release $(scripts/test-targets.sh kernel) -- --show-output'
      - 'scripts/test-floor.sh kernel 3'

  test:lwext4:
    desc: 'CROSS-VALIDATION: lwext4 — a third implementation, built in the guest — reads what we wrote, and we read what it wrote'
    # WHY IT IS ITS OWN TIER AND NOT PART OF test:oracle. `oracle` means
    # e2fsprogs: one tool suite, one failure mode, one budget. lwext4 is a
    # different oracle with a different failure mode -- a whole ext4
    # implementation that can refuse a volume outright for a feature it
    # does not have -- and folding it in would put its verdict, its count
    # and its output inside a number that is supposed to mean "e2fsprogs
    # agreed". It is separate for the same reason `kernel` is.
    #
    # AND IT CARRIES A FLOOR. A budget fails a tier that prints too much;
    # nothing fails a tier that prints too little because it RAN too
    # little. This tier is one test binary: if scripts/test-targets.sh
    # stops selecting it, `cargo test` matches nothing, exits 0 and prints
    # a green `0 passed`. The floor is what turns that red. MEASURED, like
    # the budgets, and raised rather than lowered: eight tests ran on this
    # arm64 KVM host and in the pull request that added the tier, and the
    # floor is one below that -- what it has to catch is the collapse to
    # zero, not a refactor that merges two tests into one.
    cmds:
      - scripts/tools.sh --check
      - 'scripts/tier.sh test:lwext4 lwext4 80 6000 -- scripts/test.sh --locked --release $(scripts/test-targets.sh lwext4) -- --show-output'
      - 'scripts/test-floor.sh lwext4 7'

  tools:wasm:
    desc: 'Install and verify what test:wasm needs: the wasm32 target, the wasm-bindgen test runner at Cargo.lock''s version, and node'
    cmds: ['scripts/wasm-tools.sh']

  test:wasm:
    desc: 'The browser build (wasm32-unknown-unknown): tests/wasm.rs RUN under wasm-bindgen-test in Node'
    # RUN, NOT BUILT. std on this target compiles SystemTime::now,
    # Instant::now and std::process::id and panics when they are called,
    # so only running the code finds those. tests/wasm.rs formats, mounts,
    # creates, writes and unmounts an in-memory volume; on every other
    # target it compiles to nothing. tests/scripts/test-clock-calls.sh is
    # the toolchain-free half: it refuses those calls anywhere in src/ but
    # src/runtime.rs.
    #
    # Not part of `test`: that runs in the harness guest too, which has no
    # Node. CI runs this in its own job, `wasm`, which ci-ok needs.
    #
    # FLOOR: every test in tests/wasm.rs, measured -- 2 executed when the
    # tier was added. The file is small, so one test lost is the signal.
    cmds:
      - scripts/wasm-tools.sh --check
      - 'CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER=wasm-bindgen-test-runner scripts/tier.sh test:wasm wasm 170 8000 -- cargo test --locked --target wasm32-unknown-unknown --test wasm'
      - 'scripts/test-floor.sh wasm 2'

  test:vm:
    desc: 'The whole suite, compiled and run INSIDE the harness VM (how a Mac runs the Linux tests)'
    # scripts/guest-suite.sh, through the harness's [test] guest_command.
    # The toolchain and the build directory live on the VM's own disk, so
    # the first run pays a full build and later runs are incremental.
    # FLTH_KEEP_VM=1 keeps the VM up for the next one.
    timeout: 120m
    on_timeout:
      - cmd: '../fs-linux-test-harness/scripts/vm.sh down || ../fs-linux-test-harness/scripts/vm.sh destroy'
    cmds:
      # The sibling crates this one builds against are staged on the
      # share first: the guest is given THIS repository, not the
      # directory that holds it, so a path dependency on ../rust-fs-core
      # has nothing to resolve to until it is put there. From the pinned
      # checkout's HEAD, so what the guest builds against is what
      # `chore siblings` pinned and nothing uncommitted.
      - |
        set -eu
        [ -x ../fs-linux-test-harness/scripts/vm.sh ] || {
          echo "test:vm needs the harness sibling -- run 'chore siblings'." >&2
          exit 1
        }
        share="$(../fs-linux-test-harness/scripts/vm.sh share)"
        for sibling in rust-fs-core; do
          [ -d "../$sibling/.git" ] || {
            echo "test:vm: ../$sibling is not checked out -- run 'chore siblings'." >&2
            exit 1
          }
          dest="$share/siblings/$sibling"
          rm -rf "$dest"
          mkdir -p "$dest"
          git -C "../$sibling" archive --format=tar HEAD | tar -x -C "$dest"
        done
        # --verbose is ours, not cargo's: tier.sh reads it out of CLI_ARGS
        # and streams, and it must not also reach the in-guest `cargo test`,
        # where it would mean something else entirely.
        guest_args=""
        for arg in ${CLI_ARGS:-}; do
          case "$arg" in --verbose|-v) continue ;; esac
          guest_args="$guest_args $arg"
        done
        # shellcheck disable=SC2086  # the words are the point
        scripts/tier.sh test:vm vm 2700 135000 -- \
          ../fs-linux-test-harness/scripts/vm.sh guest-test $guest_args
        scripts/test-floor.sh vm 1060

  test:
    desc: 'Everything, exactly as CI runs it — natively on Linux, inside the VM anywhere else'
    # WE RUN THE LINUX TESTS ON LINUX. This host is Linux, so they run
    # here; on a Mac there is no ext4, no loop mount and no e2fsprogs
    # worth trusting, so the same sources are built and run inside the
    # guest instead (`test:vm`). Not a reduced run and not a skip: the
    # whole suite, one Linux away.
    cmds:
      - |
        set -eu
        # --verbose belongs to the whole run, and test:native's tiers are
        # separate chore invocations: an exported variable is what reaches
        # them, which is why tier.sh reads OUTPUT_BUDGET_VERBOSE as well as the flag.
        case " ${CLI_ARGS:-} " in
          *" --verbose "*|*" -v "*) export OUTPUT_BUDGET_VERBOSE=1 ;;
        esac
        if [ "$(uname -s)" != Linux ]; then
          echo "test: this host is $(uname -s) -- running the Linux suite in the harness VM."
          exec "{{.CHORE_EXE}}" test:vm
        fi
        "{{.CHORE_EXE}}" test:native

  test:native:
    desc: 'The suite on this (Linux) host: unit (debug), the oracles, the kernel oracles, everything (release), the scripts'
    # Checks for the host tools and the fixtures FIRST and fails naming
    # the task that provides them, rather than letting several hundred
    # tests each fail on the same missing image.
    #
    # test:oracle and test:kernel run before the whole suite, which runs
    # those tests again: the price (a minute) of their evidence being in
    # every log, and of `test` staying plainly "everything".
    cmds:
      - task: test:unit
      - scripts/tools.sh --check
      - test-disks/build-fixtures.sh --check
      - task: test:oracle
      - task: test:kernel
      - task: test:lwext4
      - 'scripts/tier.sh "test:native (whole suite, release)" suite 2500 125000 -- scripts/test.sh --locked --release'
      - 'scripts/test-floor.sh suite 1060'
      - task: test:scripts
      # THE LAST LINE: one number across the tiers, and where the detail is.
      - scripts/test-verdict.sh unit oracle kernel lwext4 suite

  test:scripts:
    desc: The shell tests (tests/scripts/*.sh), every one by glob
    # By glob, so a test added later needs no edit here -- a guard that
    # has to be registered somewhere else is a guard that gets silently
    # skipped.
    cmds:
      - |
        set -eu
        scripts/tier.sh test:scripts scripts 50 3000 -- bash -c '
          set -eu
          for t in tests/scripts/*.sh; do
            echo "== $t"
            bash "$t"
          done
        '

  staticlib:
    desc: Build the static library and its headers into this crate's dist/
    # NO `out` ARGUMENT, deliberately. A library does not write into its
    # consumer. It builds into its own dist/ and a consumer asks where that
    # is — `chore artifact` prints the path. Inverting it that way means this
    # crate can change its output layout without every consumer knowing, and
    # it stays independently usable with no consumer at all.
    vars:
      OUT: 'dist'

    # Freshness, replacing the 101 lines of stamp-file and mtime comparison
    # the old scripts carried. Content checksums, so touching a file does not
    # trigger a rebuild and reverting one does not hide behind a newer mtime.
    #
    # These patterns are LITERAL on purpose. chore records a fingerprint by
    # calling fingerprint.Save WITHOUT a renderer (internal/run/run.go:313),
    # so a pattern containing {{ }} is expanded against the raw text, matches
    # nothing, and stores the empty-set hash — the task then never registers
    # as up to date. Measured 2026-08-27 against chore 0.6.0.
    sources:
      - Cargo.toml
      - 'src/**/*.rs'
      - 'include/*.h'
      # fs_core.h is a source of ours because we ship it (see the cp below).
      # THIS PATH AND THE cp MUST AGREE, and nothing checks that they do —
      # it is the same path Cargo.toml resolves am-fs-core from.
      - '../rust-fs-core/include/fs_core.h'

    # Templated, which is fine here where it is not fine above: the check
    # renders these correctly, and every entry is an exact path rather than a
    # glob, so a missing artifact is caught by the pattern failing to match.
    generates:
      - '{{.OUT}}/lib{{.LIBNAME}}.a'
      - '{{.OUT}}/include/{{.LIBNAME}}.h'

    cmds:
      # Idempotent, and it replaces a 25-line "is the target installed" dance:
      # rustup answers "up to date" without touching the network when it is.
      # It runs here rather than in the consumer because the triple is ours.
      - 'rustup target add {{.TRIPLE}}'
      - 'cargo build --release --target {{.TRIPLE}}'
      - 'mkdir -p "{{.OUT}}/include"'
      - 'cp target/{{.TRIPLE}}/release/lib{{.LIBNAME}}.a "{{.OUT}}/lib{{.LIBNAME}}.a"'
      - 'cp include/{{.LIBNAME}}.h "{{.OUT}}/include/{{.LIBNAME}}.h"'
      # Shipping fs_core.h is ours: the header we emit #includes it, so a
      # consumer handed only fs_ext4.h cannot compile.
      - 'cp "../rust-fs-core/include/fs_core.h" "{{.OUT}}/include/fs_core.h"'

  check:semver:
    desc: Refuse a public-API break the version in Cargo.toml does not declare
    # Against the newest version on crates.io, with cargo-semver-checks: a
    # break needs the 0.x minor to move, an addition the patch. Why, and what
    # it cannot see, is at the top of the script (#120). No `sources:` on
    # purpose -- the baseline is the registry, which moves without this tree
    # changing, so a fingerprint would call a stale answer up to date.
    #
    # Budget: measured 11 lines / 489 bytes on a passing run with the
    # baseline's rustdoc cached, one line more when it is built (the first
    # run, and every CI run). The lines are fixed, not per-item, so 40 /
    # 4,000 leaves room for a warning block without masking a flood. A
    # failing run prints every broken item and is not held to it.
    cmds:
      - 'scripts/tier.sh check:semver semver 40 4000 -- scripts/semver-check.sh'

  lint:
    desc: Formatting and clippy, exactly as CI runs them
    # `--locked` is not decoration. It makes the build fail rather than
    # silently update Cargo.lock, which is what keeps a local gate and
    # CI checking the same dependency versions — and it is what the
    # release process relies on.
    #
    # This exists so the CI gate can be reproduced locally. If the two
    # ever differ, this is the copy that is wrong.
    cmds:
      - scripts/agents-core-check.sh
      - scripts/ci-gate.sh
      - cargo fmt --check
      - cargo clippy --locked --all-targets -- -D warnings

  build:
    desc: Debug build
    cmds: ['cargo build']


  clean:
    desc: Remove this crate's cargo output
    cmds: ['cargo clean']

  artifact:
    desc: Print the absolute path of the directory holding the built outputs
    # `silent: true` is what makes this usable as a VALUE — without it chore
    # echoes each command and a caller capturing stdout gets the echo too.
    # PATTERNS.md: "a value — a flag string, a container status, a path" is a
    # task called through {{.CHORE_EXE}}.
    silent: true
    # NO `deps: [staticlib]`. chore prints "task: staticlib is up to date" on
    # STDOUT, which a caller capturing this as a value receives as PART OF THE
    # VALUE — measured on rust-blk-probe, where the capture came back as two
    # lines and the caller's path check failed. A value-returning task returns
    # a value and does nothing else; the caller builds first, then asks. Two
    # calls, on purpose.
    #
    # IT PRINTS A DIRECTORY, NOT A FILE, and that is the one place this differs
    # from rust-blk-probe's `artifact`. That crate produces a single binary, so
    # it can name a file. This one produces libfs_ext4.a AND the headers beside
    # it, so there is no single path to name — A CONSUMER COPIES THE CONTENTS of
    # what this prints. A consumer that treats it as a file path will silently
    # copy the wrong thing.
    cmds:
      - 'cd "{{.OUT}}" && pwd -P'
    vars:
      OUT: 'dist'

  check:ci-gate:
    desc: The one required check stands for every job in ci.yml
    # A chore task naming a script, and nothing else. This was
    # tests/ci_aggregate_gate.rs, which parsed a YAML file and compared
    # strings, and as a cargo test counted towards the executed-test floor the
    # gate itself enforces.
    cmds:
      - scripts/ci-gate.sh
