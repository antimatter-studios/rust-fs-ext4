[package]
name = "am-fs-ext4"
version = "0.6.0"
edition = "2021"
# The oldest toolchain the library and the binaries build on, so an older
# one gets cargo's "requires rustc" message rather than a wall of E0658.
# Measured, not guessed: 1.87 is where `is_multiple_of` on unsigned
# integers stabilised, and 1.86 refuses seven uses of it. The dev-
# dependencies need newer (ordered-float, via saphyr, wants 1.90); they
# never reach a consumer. `chore check:msrv` builds at exactly this version.
rust-version = "1.87"
license = "MIT"
description = "Pure-Rust ext4 filesystem driver. Exposes a C ABI (fs_ext4_*) suitable for FFI from C/C++/Go/etc."
repository = "https://github.com/christhomas/rust-fs-ext4"

# The fuzz crate is its own package, on its own toolchain, and is not
# part of this one. Without this, `cargo package` and `cargo publish`
# try to include it and fail on the nightly-only dependency.
exclude = ["fuzz"]

# `tests/support` is a member so clippy reaches it: clippy lints
# workspace members only, so as a bare path dependency no flag on the
# root invocation linted it (#410). The root package stays the default
# member, so a plain `cargo test` or `cargo build` is unchanged; `chore
# lint` passes `--workspace`. `fuzz` is excluded because it is its own
# package, on its own toolchain, with its own lock file. The root
# package is a member without being listed, and must not be: `"."`
# would contain `fuzz` and override the exclusion.
[workspace]
members = ["tests/support"]
exclude = ["fuzz"]

[lib]
name = "fs_ext4"
crate-type = ["staticlib", "rlib"]

# Standalone CLI tool. Cross-platform — builds + runs identically on
# Linux/macOS/Windows because it only depends on this crate's own
# pure-Rust format path. Distributed via Homebrew tap on macOS and
# `cargo install` everywhere; embedders that route formatting through
# their own UI (e.g. an FSKit `startFormat` handler) call
# `format_filesystem()` directly instead of shelling out to this binary.
#
# Binary name uses underscore — Cargo's bin name field doesn't accept
# dots. Homebrew formula symlinks /usr/local/bin/mkfs.ext4 → mkfs_ext4
# at install time so the user-visible command matches Linux convention.
[[bin]]
name = "mkfs_ext4"
path = "src/bin/mkfs_ext4.rs"

# THE COMMAND-LINE TOOLS: one multi-call binary, named for the repository.
# It dispatches on argv[0], the way busybox and e2fsprogs do, so the
# release step installs it once as `rust-fs-ext4` and links `mkfs.ext4`,
# `fsck.ext4` and `fs.ext4` to it (cargo refuses a dot in a target name,
# so the dotted names are never cargo's). `rust-fs-ext4 <tool> ...` is the
# form nothing else on PATH can shadow, and `cargo run --features cli --
# mkfs ...` works before anything is installed.
#
# BEHIND THE `cli` FEATURE, so the static library a consumer links gains no
# dependency from the tools: `required-features` keeps the target out of a
# build that did not ask for it. scripts/test.sh, `chore lint` and
# scripts/msrv.sh ask for it, so the tests, clippy and the MSRV build all
# reach it.
[[bin]]
name = "rust-fs-ext4"
path = "src/cli/main.rs"
required-features = ["cli"]

[features]
# The command-line tools and nothing else. clap, clap_complete and
# clap_mangen are MIT/Apache-2.0.
cli = ["dep:clap", "dep:clap_complete", "dep:clap_mangen"]

[dependencies]
crc32c = "0.6"
bitflags = "2"
unicode-normalization = "0.1"
caseless = "0.2"
# Block-device trait surface shared with sister crates (qcow2 reader,
# partition probe, future fs-* drivers). Local path dep until both crates
# publish; flip to a published version on the first crates.io release.
# Strictly additive — ext4's existing BlockDevice trait is unchanged; this
# adds a bridge module so external `fs_core::BlockDevice` implementors
# (a `Qcow2Reader`, a `SliceReader`, etc.) can be mounted by ext4.
am-fs-core = { path = "../rust-fs-core", version = "0.2.13" }
# The command-line tools' argument parser, behind the `cli` feature (see
# the `rust-fs-ext4` target above). No derive: the builder API keeps each
# tool's command a function the man pages and completions can be made from.
clap = { version = "4.5", optional = true, default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
# Shell completions and man pages, generated from the same clap commands by
# the binary itself (`rust-fs-ext4 generate ...`) when a release is packaged,
# so the documentation cannot describe a flag the program does not take.
# Both MIT/Apache-2.0, both behind `cli`.
clap_complete = { version = "4.5", optional = true }
clap_mangen = { version = "0.2", optional = true }

[dev-dependencies]
hex = "0.4"
# YAML parser for tests/ci_profile.rs, which reads .github/workflows/ci.yml
# and refuses if the debug run that lets the PR gate see an arithmetic
# overflow has been removed or disabled. That guard hand-rolled its own
# scanner and needed a helper per piece of ordinary grammar -- comments,
# quoted keys, block scalar styles, indentation, whole trigger names --
# all of which a YAML parser already has. Pure Rust, YAML 1.2 (so
# GitHub's `on:` key stays the string `on` and is not folded into a
# boolean), MIT/Apache-2.0, and no C to transpile -- unlike serde_yaml,
# which is deprecated and wraps unsafe-libyaml. Test-only: it never
# reaches a consumer of this crate.
saphyr = "0.0.12"

# The fixture, oracle and VM helpers are Unix-host code (they spawn
# processes and build paths from raw bytes), and nothing that runs on the
# browser build uses them: tests/wasm.rs is the one test built for it.
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dev-dependencies]
fs-ext4-test-support = { path = "tests/support" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "unwind"  # required for catch_unwind at FFI boundary (see src/capi.rs)

[profile.dev]
opt-level = 1
panic = "unwind"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = "0.3"

# The browser build's tests (tests/wasm.rs, `chore test:wasm`) run under
# wasm-bindgen-test in Node. MIT/Apache-2.0, test-only, and only for the
# target that needs it: no other build resolves it.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"
