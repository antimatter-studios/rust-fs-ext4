name: release

on:
  push:
    tags:
      - 'v*.*.*'

# EVERY JOB READS, AND ONE JOB WRITES (#329).
#
# `contents: write` is held by the `release` job alone, which checks
# nothing out and runs only GitHub's own artifact and attestation actions. Every action here is pinned to
# a commit SHA, with the tag it stood for beside it: a tag is a pointer its
# owner can move, and a job holding a token should not run whatever it
# points at today. Every checkout sets `persist-credentials: false`, so no
# later step finds the token in .git/config.
# tests/scripts/test-write-jobs-pinned.sh fails a write job that runs an
# unpinned action or persists its token.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CHORE_VERSION: "0.11.0"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: verify tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate_ver=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"(.*)"/\1/')
          if [ "$tag" != "$crate_ver" ]; then
            echo "tag $tag does not match Cargo.toml version $crate_ver" >&2
            exit 1
          fi

      # The same gate as a pull request's CI, through the same chore
      # tasks: the siblings at their pinned refs (rust-fs-core is the
      # path dependency), the oracle tools, the kernel-made fixtures in
      # the fs-linux-test-harness VM (ubuntu-latest is x86_64 with KVM),
      # lint, and the whole suite -- which includes the e2fsck checks of
      # the mkfs_ext4 binary (tests/mkfs_bin_fsck_oracle.rs) that used to
      # be a job of their own here.
      - name: install chore
        run: scripts/ci-install-chore.sh
      - name: chore siblings
        run: chore siblings
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-27
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: chore tools
        run: chore tools
      - name: KVM, QEMU and Vagrant
        run: ../fs-linux-test-harness/scripts/ci-setup-linux.sh
      - name: chore fixtures
        run: chore fixtures
      - name: chore lint
        run: chore lint
      - name: chore test
        run: chore test

  # Build the CLI as a downloadable binary, so it can be installed with a
  # package manager rather than `cargo install`.
  #
  # THE BINARY IS RENAMED HERE, and that is the point of this job. Cargo
  # refuses a dot in a target name ("invalid character '.' in crate
  # name"), so the target is `mkfs_ext4` and the published artifact is
  # `mkfs.ext4` — the name the format's convention actually uses, and the
  # one `mkfs -t ext4` resolves to. The underscore is a build-system
  # constraint and has no business appearing in a public artifact, so the
  # rename happens before packaging (scripts/package-cli.sh) rather than in
  # a package manager's formula, where a direct downloader would never see
  # it.
  #
  # Native builds only, one runner per platform: cross-compiling Rust
  # needs either a cross toolchain or an emulator, and neither is worth
  # it for two targets that GitHub already provides natively.
  package-cli:
    name: package mkfs.ext4 (${{ matrix.label }})
    needs: [test]
    # Read-only. A leg uploads its tarball as a workflow artifact; the
    # `release` job publishes them together once every leg has passed.
    strategy:
      # One platform failing should not hide whether the other built.
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            label: darwin-arm64
          - runner: ubuntu-latest
            label: linux-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The path dependency, at the ref chores.yml pins (read from there
      # rather than restated; chore itself has no build for every runner
      # this job uses).
      - name: clone am-fs-core sibling
        shell: bash
        run: |
          set -euo pipefail
          pin() { sed -n "s/^  $1: *//p" chores.yml | tr -d '\r'; }
          git clone --depth 1 --branch "$(pin FS_CORE_REF)" "$(pin FS_CORE_URL)" ../rust-fs-core

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-27
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: build mkfs_ext4
        shell: bash
        run: cargo build --release --locked --bin mkfs_ext4

      # scripts/package-cli.sh stages the tarball as an install prefix --
      # bin/mkfs.ext4, share/rust-fs-ext4/CAVEATS and LICENSE -- so an
      # installer copies it whole and never names a tool, and then checks
      # it: exactly those files, a tool that answers --help, and a
      # --version naming this crate and this tag's version. A tarball whose
      # tool will not run is worse than no tarball; the failure would
      # otherwise surface as a user's bug report rather than a red build.
      # Formatting a real image and checking it with fsck.ext4 is what the
      # test job's tests/mkfs_bin_fsck_oracle.rs covers.
      - name: package and check mkfs.ext4
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(scripts/package-cli.sh "${GITHUB_REF_NAME#v}" "${{ matrix.label }}")"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

          # The formula needs this to verify the download; printing it
          # into the job summary means updating a formula is a copy, not
          # a local re-download and re-hash.
          {
            echo "### $tarball"
            echo ""
            echo '```'
            echo "sha256 $(shasum -a 256 "$tarball" | cut -d' ' -f1)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # AN ARTIFACT, NOT THE RELEASE. A leg that published its own asset
      # did so whether or not the other leg later failed, and with
      # `fail-fast: false` that left a release with one platform on it
      # (#329). tests/scripts/test-release-outside-matrix.sh fails a
      # matrix job that touches the release.
      - name: keep the tarball for the release job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mkfs-ext4-${{ matrix.label }}
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  # The one job that writes to the repository, and it runs only when every
  # leg of package-cli passed. It checks nothing out: it downloads the legs'
  # tarballs, attests their provenance, and hands them to `gh`.
  release:
    name: publish the GitHub release
    needs: [package-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: the OIDC token signs the attestation, and
      # attestations: write stores it against this repository.
      id-token: write
      attestations: write
    steps:
      - name: collect every leg's tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mkfs-ext4-*
          path: dist
          merge-multiple: true

      # A signed statement that each tarball was built by this workflow from
      # this commit, before anything is published. An installer checks it
      # with `gh attestation verify <tarball> --repo <owner>/<repo>
      # --signer-workflow <owner>/<repo>/.github/workflows/release.yml`.
      - name: attest the tarballs' build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      # The release for a tag may not exist yet — this repo's tags have
      # historically been published to crates.io without a GitHub
      # release. `gh release create` with the assets uploads them to a
      # draft and publishes it once they are all there; a release that
      # already exists (a re-run) gets them in one `upload`.
      - name: create the release, or upload to it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          shopt -s nullglob
          assets=(dist/*.tar.gz)
          if [ "${#assets[@]}" -ne 2 ]; then
            echo "expected 2 tarballs (one per package-cli leg), found ${#assets[@]}: ${assets[*]}" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --title "$tag" --generate-notes
          fi

  publish:
    name: publish to crates.io
    needs: [test]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The path dependency, at the ref chores.yml pins (read from there
      # rather than restated; chore itself has no build for every runner
      # this job uses).
      - name: clone am-fs-core sibling
        shell: bash
        run: |
          set -euo pipefail
          pin() { sed -n "s/^  $1: *//p" chores.yml | tr -d '\r'; }
          git clone --depth 1 --branch "$(pin FS_CORE_REF)" "$(pin FS_CORE_URL)" ../rust-fs-core

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-27
        with:
          toolchain: 1.95.0

      # A version already on crates.io cannot be published again, and a
      # re-tag — or a release published by hand — would otherwise fail
      # this job every time. Skip instead, so the workflow is idempotent
      # and a red run means something actually went wrong.
      #
      # 200 is published and 404 is not; anything else -- a 429, a 5xx, a
      # timeout -- is retried and then fails the step, rather than being
      # read as "not published" and sent on to a `cargo publish` that
      # fails with "already exists" (#329).
      # tests/scripts/test-crates-io-check.sh runs this step against a
      # stubbed curl.
      - name: skip if this version is already on crates.io
        id: already
        shell: bash
        run: scripts/crates-io-published.sh >> "$GITHUB_OUTPUT"

      - uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4
        if: steps.already.outputs.published == 'false'
        id: auth

      - name: cargo publish
        if: steps.already.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # No `--locked`: publish must rewrite the `am-fs-core` path
        # dependency into its registry equivalent in the packaged
        # lockfile, which `--locked` forbids ("cannot update the lock
        # file"). The verify-build resolves am-fs-core from crates.io
        # via the `version` constraint, so the published artifact is
        # pinned by that constraint, not by the local path checkout.
        run: cargo publish
