name: release

on:
  push:
    tags:
      - 'v*.*.*'

# EVERY JOB READS, AND ONE JOB WRITES (#329).
#
# `contents: write` is held by the `attach` job alone, which checks nothing out. Every action here is pinned to
# a commit SHA, with the tag it stood for beside it: a tag is a pointer its
# owner can move, and a job holding a token should not run whatever it
# points at today. Every checkout sets `persist-credentials: false`, so no
# later step finds the token in .git/config.
# tests/scripts/test-write-jobs-pinned.sh fails a write job that runs an
# unpinned action or persists its token.
permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always
  CHORE_VERSION: "0.11.0"
  FLTH_RESOURCE_PROFILE: low

jobs:
  test-gate:
    runs-on: antimatter-vps-gate
    timeout-minutes: 1
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        run: runner-gate pick linux-x64-kvm

  test:
    name: test
    needs: test-gate
    runs-on: antimatter-vps-linux-x64
    # The oracle tools, the kernel and lwext4 run in fs-linux-test-harness's
    # guest, under TCG (the runner has no KVM) with QEMU's translation cache
    # capped (FLTH_VM_MEM, MiB) and the guest's RAM (FLTH_GUEST_MEM).
    timeout-minutes: 480
    env:
      FLTH_ACCELERATOR: tcg
      FLTH_VM_MEM: '1024'
      FLTH_GUEST_MEM: '768'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: C toolchain for the gated runner
        # Only a self-hosted Linux runner lacks it; the hosted image has it.
        run: |
          if [ "$RUNNER_OS" = Linux ] && [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            sudo apt-get update && sudo apt-get install -y build-essential
          fi

      - name: verify tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate_ver=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"(.*)"/\1/')
          if [ "$tag" != "$crate_ver" ]; then
            echo "tag $tag does not match Cargo.toml version $crate_ver" >&2
            exit 1
          fi

      # The same gate as a pull request's CI, through the same chore
      # tasks: the siblings at their pinned refs (rust-fs-core for its
      # scripts), the kernel-made fixtures and the oracle tools in the
      # harness's guest (the runner has no KVM; see ci.yml), lint, and the
      # whole suite -- which
      # includes the e2fsck checks of the mkfs.ext4 tool
      # (tests/mkfs_bin_fsck_oracle.rs) that used to be a job of their own
      # here.
      - name: install chore
        run: scripts/ci-install-chore.sh
      - name: chore siblings
        run: chore siblings
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-27
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: antimatter-studios/fs-linux-test-harness/.github/actions/install-virtiofsd@feat/vagrant-tcg
      - name: QEMU and Vagrant for the harness guest (TCG)
        run: bash ../fs-linux-test-harness/scripts/ci-setup-linux.sh
      - name: chore fixtures, in the harness guest
        run: chore fixtures
      - name: chore lint
        run: chore lint
      - name: chore test, the oracles in the harness guest
        run: chore test

  cli:
    needs: [test, publish]
    name: package the tools (${{ matrix.label }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        label: [darwin-arm64, linux-x86_64]
    runs-on: antimatter-vps-linux-x64
    steps:
      - name: Verify build platform before packaging
        env:
          LABEL: ${{ matrix.label }}
        run: |
          case "$LABEL:$(uname -s):$(uname -m)" in
            linux-x86_64:Linux:x86_64|darwin-arm64:Darwin:arm64) ;;
            *) echo "::error::No verified native build path for $LABEL on this runner"; exit 1 ;;
          esac
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: refuse anything but a version tag
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "::error::release-cli packages a version tag, not $GITHUB_REF" >&2; exit 1 ;;
          esac

      - name: clone the rust-fs-core sibling
        shell: bash
        env:
          CORE_REF: v0.5.1
        run: git clone --depth 1 --branch "$CORE_REF" https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core

      - name: the CHANGELOG describes this version
        uses: antimatter-studios/agent-skills/.github/actions/changelog-notes@ed0b96812c5908478dcd84543debf4d5f8bf87e3
        with:
          tag: ${{ github.ref_name }}
          output-file: notes/release-notes.md

      - name: keep the notes for the attach job
        if: matrix.label == 'linux-x86_64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: notes/release-notes.md
          if-no-files-found: error
          retention-days: 7

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-27
        with:
          toolchain: 1.95.0

      - name: build the multi-call binary
        shell: bash
        run: cargo build --release --locked --features cli --bin "${GITHUB_REPOSITORY##*/}"

      - name: package and check the tarball
        id: pack
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          bash ../rust-fs-core/scripts/package-cli.sh "${GITHUB_REF_NAME#v}" "$LABEL" > "$RUNNER_TEMP/tarball"
          tarball="$(tail -n 1 "$RUNNER_TEMP/tarball")"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          {
            echo "### $tarball"
            echo ""
            echo '```'
            if command -v sha256sum >/dev/null 2>&1; then
              echo "sha256 $(sha256sum "$tarball" | cut -d' ' -f1)"
            else
              echo "sha256 $(shasum -a 256 "$tarball" | cut -d' ' -f1)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: keep the tarball for the attach job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-${{ matrix.label }}
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  attach:
    name: attest and attach the tools
    needs: cli
    runs-on: antimatter-vps-linux-x64
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: collect every leg's tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true

      - name: the release notes the package job read from the CHANGELOG
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
          path: notes

      - name: one asset per platform, no more and no fewer
        shell: bash
        env:
          EXPECTED: '2'
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*.tar.gz dist/*.zip)
          everything=(dist/*)
          if [ "${#assets[@]}" -ne "$EXPECTED" ] || [ "${#everything[@]}" -ne "${#assets[@]}" ]; then
            echo "::error::expected $EXPECTED assets (one per package leg) and nothing else, found ${everything[*]}" >&2
            exit 1
          fi

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: attach the tarballs to the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes/release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  publish-gate:
    needs: [test]
    runs-on: antimatter-vps-gate
    timeout-minutes: 1
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        run: runner-gate pick linux-x64

  publish:
    name: publish to crates.io
    needs: [test, publish-gate]
    runs-on: antimatter-vps-linux-x64
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: C toolchain for the gated runner
        if: runner.environment == 'self-hosted'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      # rust-fs-core's scripts, at the ref chores.yml pins (read from there
      # rather than restated; chore itself has no build for every runner
      # this job uses).
      - name: clone rust-fs-core sibling
        shell: bash
        run: |
          set -euo pipefail
          pin() { sed -n "s/^  $1: *//p" chores.yml | tr -d '\r'; }
          git clone --depth 1 --branch "$(pin FS_CORE_REF)" "$(pin FS_CORE_URL)" ../rust-fs-core

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-27
        with:
          toolchain: 1.95.0

      # A version already on crates.io cannot be published again, and a
      # re-tag — or a release published by hand — would otherwise fail
      # this job every time. Skip instead, so the workflow is idempotent
      # and a red run means something actually went wrong.
      #
      # 200 is published and 404 is not; anything else -- a 429, a 5xx, a
      # timeout -- is retried and then fails the step, rather than being
      # read as "not published" and sent on to a `cargo publish` that
      # fails with "already exists" (#329).
      # tests/scripts/test-crates-io-check.sh runs this step against a
      # stubbed curl.
      - name: skip if this version is already on crates.io
        id: already
        shell: bash
        run: scripts/crates-io-published.sh >> "$GITHUB_OUTPUT"

      - uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4
        if: steps.already.outputs.published == 'false'
        id: auth

      # A tag the CHANGELOG does not describe stops here, before crates.io has
      # anything: the release body is that section, from github-guard's changelog
      # extraction through agent-skills' changelog-notes action.
      - name: the CHANGELOG describes this version
        uses: antimatter-studios/agent-skills/.github/actions/changelog-notes@ed0b96812c5908478dcd84543debf4d5f8bf87e3
        with:
          tag: ${{ github.ref_name }}
      - name: cargo publish
        if: steps.already.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # No `--locked`: publish must rewrite the `rust-fs-core` path
        # dependency into its registry equivalent in the packaged
        # lockfile, which `--locked` forbids ("cannot update the lock
        # file"). The verify-build resolves rust-fs-core from crates.io
        # via the `version` constraint, so the published artifact is
        # pinned by that constraint, not by the local path checkout.
        run: cargo publish
