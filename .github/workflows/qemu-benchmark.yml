name: QEMU runner benchmark (pilot)

on:
  pull_request:
    paths:
      - .github/workflows/qemu-benchmark.yml
      - .github/actions/qemu-benchmark/**
      - scripts/ci-qemu-*.sh
      - scripts/ci-qemu-*.py
      - scripts/test-ci-qemu-*.py
      - scripts/qemu-pilot-environment.json
      - scripts/qemu-runner/**
      - scripts/qemu-guest-network.yaml
      - scripts/test-ci-qemu-benchmark.sh
      - scripts/test-report-qemu-benchmark.py
      - scripts/report-qemu-benchmark.py
  workflow_dispatch:
    inputs:
      workload:
        description: Workload (single executes one real ext4 mount test)
        type: choice
        options: [single, smoke, full]
        default: single

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: qemu-pilot-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  CHORE_VERSION: '0.11.0'

jobs:
  hosted-x64:
    if: >-
      github.actor == 'christhomas' && github.triggering_actor == 'christhomas' &&
      (github.event.sender.login == 'christhomas' || github.event.sender.login == '') &&
      (github.event.pull_request.user.login == 'christhomas' || github.event.pull_request.user.login == '')
    runs-on: antimatter-vps-linux-x64
    timeout-minutes: ${{ inputs.workload == 'full' && 180 || 30 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/qemu-benchmark
        with:
          arch: x86_64
          accelerator: kvm
          requested-runner: antimatter-vps-linux-x64
          selected-runner: antimatter-vps-linux-x64
          workload: ${{ inputs.workload || 'single' }}

  vps-x64:
    if: >-
      github.actor == 'christhomas' && github.triggering_actor == 'christhomas' &&
      (github.event.sender.login == 'christhomas' || github.event.sender.login == '') &&
      (github.event.pull_request.user.login == 'christhomas' || github.event.pull_request.user.login == '')
    runs-on: antimatter-vps-linux-x64
    timeout-minutes: ${{ inputs.workload == 'full' && 180 || 30 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/qemu-benchmark
        with:
          arch: x86_64
          accelerator: tcg
          requested-runner: antimatter-vps-linux-x64
          selected-runner: antimatter-vps-linux-x64
          workload: ${{ inputs.workload || 'single' }}

  hosted-arm64:
    if: >-
      github.actor == 'christhomas' && github.triggering_actor == 'christhomas' &&
      (github.event.sender.login == 'christhomas' || github.event.sender.login == '') &&
      (github.event.pull_request.user.login == 'christhomas' || github.event.pull_request.user.login == '')
    runs-on: antimatter-vps-linux-x64
    timeout-minutes: ${{ inputs.workload == 'full' && 180 || 30 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/qemu-benchmark
        with:
          arch: aarch64
          accelerator: tcg
          requested-runner: antimatter-vps-linux-x64
          selected-runner: antimatter-vps-linux-x64
          workload: ${{ inputs.workload || 'single' }}

  vps-arm64:
    if: >-
      github.actor == 'christhomas' && github.triggering_actor == 'christhomas' &&
      (github.event.sender.login == 'christhomas' || github.event.sender.login == '') &&
      (github.event.pull_request.user.login == 'christhomas' || github.event.pull_request.user.login == '')
    runs-on: antimatter-vps-linux-x64
    timeout-minutes: ${{ inputs.workload == 'full' && 180 || 30 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/qemu-benchmark
        with:
          arch: aarch64
          accelerator: tcg
          requested-runner: antimatter-vps-linux-x64
          selected-runner: antimatter-vps-linux-x64
          workload: ${{ inputs.workload || 'single' }}

  report:
    if: >-
      always() && github.actor == 'christhomas' && github.triggering_actor == 'christhomas' &&
      (github.event.sender.login == 'christhomas' || github.event.sender.login == '') &&
      (github.event.pull_request.user.login == 'christhomas' || github.event.pull_request.user.login == '')
    needs: [hosted-x64, vps-x64, hosted-arm64, vps-arm64]
    runs-on: antimatter-vps-linux-x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qemu-*
          path: tmp/benchmark-artifacts
      - name: Compare total time to result, not execution speed alone
        env:
          GH_TOKEN: ${{ github.token }}
          WORKLOAD: ${{ inputs.workload || 'single' }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > tmp/benchmark-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > tmp/benchmark-run.json
          python3 scripts/report-qemu-benchmark.py tmp/benchmark-artifacts tmp/benchmark-jobs.json tmp/benchmark-run.json "$WORKLOAD" "$SOURCE_COMMIT" | tee -a "$GITHUB_STEP_SUMMARY"
