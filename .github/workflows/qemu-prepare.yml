name: QEMU guest preparation (pilot)

on:
  pull_request:
    paths:
      - .github/workflows/qemu-prepare.yml
      - .github/actions/qemu-benchmark/**
      - scripts/ci-qemu-*.sh
      - scripts/ci-qemu-*.py
      - scripts/qemu-pilot-environment.json
      - scripts/qemu-runner/**
      - scripts/qemu-guest-network.yaml
      - scripts/vm-setup.sh
      - test-disks/guest-build-images.sh
      - tests/lwext4/**
      - rust-toolchain.toml
  workflow_dispatch:
    inputs:
      workload:
        description: Prepared guest workload
        type: choice
        options: [single, smoke, full]
        default: single

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: qemu-prepare-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  CHORE_VERSION: '0.11.0'

jobs:
  environment:
    name: publish-runner-x86_64
    if: >-
      github.actor == 'christhomas' && github.triggering_actor == 'christhomas' &&
      (github.event.sender.login == 'christhomas' || github.event.sender.login == '') &&
      (github.event.pull_request.user.login == 'christhomas' || github.event.pull_request.user.login == '')
    runs-on: antimatter-vps-linux-x64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install chore and fetch pinned provisioning inputs
        run: |
          bash scripts/ci-install-chore.sh
          "$HOME/.local/bin/chore" siblings
      - name: Build and publish provisioned runner environment
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: x86_64
          BENCH_CACHE_REGISTRY: ghcr.io/${{ github.repository }}/qemu-pilot
        run: |
          bash scripts/ci-qemu-environment.sh prepare "$ARCH" | tee runner-digest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runner-environment-x86_64
          path: runner-digest.txt

  prepare:
    name: prepare-${{ matrix.arch }}
    needs: environment
    if: >-
      github.actor == 'christhomas' && github.triggering_actor == 'christhomas' &&
      (github.event.sender.login == 'christhomas' || github.event.sender.login == '') &&
      (github.event.pull_request.user.login == 'christhomas' || github.event.pull_request.user.login == '')
    strategy:
      fail-fast: false
      matrix:
        include:
          # The VPS runner is x86_64 without KVM, so both guests are prepared
          # under TCG, in the x86_64 runner environment published above.
          - arch: x86_64
            accelerator: tcg
          - arch: aarch64
            accelerator: tcg
    runs-on: antimatter-vps-linux-x64
    timeout-minutes: ${{ inputs.workload == 'full' && 180 || 45 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/qemu-benchmark
        with:
          mode: prepare
          arch: ${{ matrix.arch }}
          accelerator: ${{ matrix.accelerator }}
          requested-runner: antimatter-vps-linux-x64
          selected-runner: antimatter-vps-linux-x64
          workload: ${{ inputs.workload || 'single' }}
      - name: Verify published guest on a fresh warm overlay
        env:
          GH_TOKEN: ${{ github.token }}
          BENCH_CACHE_REGISTRY: ghcr.io/${{ github.repository }}/qemu-pilot
          ARCH: ${{ matrix.arch }}
          ACCELERATOR: ${{ matrix.accelerator }}
          WORKLOAD: ${{ inputs.workload || 'single' }}
        run: bash scripts/ci-qemu-runner.sh run "$ARCH" "$ACCELERATOR" "$WORKLOAD"
      - name: Restore warm-restore diagnostic ownership
        if: always()
        run: bash scripts/ci-qemu-diagnostics.sh
      - name: Preserve warm-restore evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: warm-restore-${{ matrix.arch }}
          path: |
            tmp/qemu-benchmark/**/*.json
            tmp/qemu-benchmark/**/*.txt
            tmp/qemu-benchmark/**/*.tsv
            tmp/qemu-benchmark/**/*.time
            tmp/qemu-benchmark/**/*.log
          if-no-files-found: error
