name: branch-reap

# A merged pull request's branch is deleted when it merges, unless something
# still needs it: the default, protected, merge-queue and wip/ branches, a
# branch an open pull request is based on or headed by, and one pushed to
# after its merge are all kept. The rules and the delete are rust-fs-core's
# (branch-reap.yml, scripts/branch-reap.sh). GitHub's own delete-on-merge
# stays off: it deletes a branch a stacked pull request is still based on.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  reap:
    permissions:
      contents: write
      pull-requests: read
    uses: antimatter-studios/rust-fs-core/.github/workflows/branch-reap.yml@34e3610c298b3789dd1d39d3635e9aad38fae06a # v0.3.17
    with:
      core-ref: v0.3.17
