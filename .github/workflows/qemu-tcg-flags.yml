name: QEMU TCG flag experiment
# Measures what each emulated-CPU option does to an ARM64 guest's boot and
# test time, on GitHub-hosted runners of both architectures. It does not gate
# anything. Dispatch it after `qemu-prepare.yml` has published the guest and
# test bundle for the commit.

on:
  push:
    branches: [ci/register-tcg-flags]
  workflow_dispatch:
    inputs:
      workload:
        description: Workload to time
        type: choice
        options: [single, smoke]
        default: smoke

permissions:
  contents: read
  actions: read
  packages: read

env:
  CHORE_VERSION: '0.11.0'

jobs:
  flags:
    name: ${{ matrix.variant }} on ${{ matrix.runner }}
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'christhomas' && github.triggering_actor == 'christhomas'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
        include:
          - { variant: baseline, cpu: max, accel: 'tcg,thread=multi' }
          - { variant: baseline-repeat, cpu: max, accel: 'tcg,thread=multi' }
          - { variant: pauth-impdef, cpu: 'max,pauth-impdef=on', accel: 'tcg,thread=multi' }
          - { variant: pauth-off, cpu: 'max,pauth=off', accel: 'tcg,thread=multi' }
          - { variant: tb-1024, cpu: max, accel: 'tcg,thread=multi,tb-size=1024' }
          - { variant: cortex-a72, cpu: cortex-a72, accel: 'tcg,thread=multi' }
          - { variant: impdef-tb-1024, cpu: 'max,pauth-impdef=on', accel: 'tcg,thread=multi,tb-size=1024' }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    env:
      QEMU_TCG_CPU: ${{ matrix.cpu }}
      QEMU_TCG_ACCEL: ${{ matrix.accel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/qemu-benchmark
        with:
          arch: aarch64
          accelerator: tcg
          requested-runner: ${{ matrix.runner }}
          selected-runner: ${{ matrix.runner }}
          workload: ${{ inputs.workload }}
          label: ${{ matrix.variant }}-${{ matrix.runner }}
      - name: Summarise this variant
        if: always()
        run: |
          python3 - "${{ matrix.variant }}" "${{ matrix.runner }}" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, pathlib, sys
          variant, runner = sys.argv[1:]
          for path in sorted(pathlib.Path("tmp/qemu-benchmark").rglob("result.json")):
              r = json.loads(path.read_text())
              boot = path.with_name("boot-seconds.txt")
              print(f"RESULT variant={variant} runner={runner} status={r['status']} "
                    f"boot_s={boot.read_text().strip() if boot.exists() else 'n/a'} "
                    f"total_s={r['elapsed_seconds']} cpu={r['tcg_cpu']} accel={r['tcg_accel']}")
          PY
