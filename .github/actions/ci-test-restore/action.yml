name: Restore verified test artifacts
description: Install the exact prebuilt bundle and native guest tools on the test runner
inputs:
  arch:
    description: Guest architecture
    required: true
  key:
    description: Exact artifact input hash
    required: true
  image:
    description: Immutable image used for compilation
    required: true
  artifact:
    description: Workflow artifact name emitted by the build job
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact }}
        path: tmp/ci-test-bundle
    - env:
        ARCH: ${{ inputs.arch }}
        KEY: ${{ inputs.key }}
        IMAGE: ${{ inputs.image }}
      run: |
        set -euo pipefail
        test "$(python3 scripts/ci-test-bundle.py key "$ARCH" "$IMAGE")" = "$KEY"
        bash scripts/ci-test-native-tools.sh "$ARCH"
        sudo mkdir /opt/ext4-ci
        sudo chown "$(id -u):$(id -g)" /opt/ext4-ci
        bash scripts/ci-test-workspace.sh
        cd /opt/ext4-ci/rust-fs-ext4
        python3 scripts/ci-test-bundle.py install "$ARCH" "$KEY" "$GITHUB_WORKSPACE/tmp/ci-test-bundle/bundle.tar"
      shell: bash
