[package]
name = "fs-ext4-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# The explorer half of the fuzzing setup. The gate half is
# tests/fuzz_decoders.rs in the parent crate, which replays and mutates
# the same corpus on the stable toolchain -- see that file's header for
# why the work is split in two.
#
# Run one target:
#   cargo +nightly fuzz run image -- -max_total_time=60
# Run all of them, which is what CI does:
#   scripts/fuzz-all.sh 60

[dependencies]
libfuzzer-sys = "0.4"
rust-fs-ext4 = { path = ".." }
rust-fs-core = { path = "../../rust-fs-core", version = "0.3.7" }

[[bin]]
name = "image"
path = "fuzz_targets/image.rs"
test = false
doc = false
bench = false

[[bin]]
name = "superblock"
path = "fuzz_targets/superblock.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inode"
path = "fuzz_targets/inode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dir_block"
path = "fuzz_targets/dir_block.rs"
test = false
doc = false
bench = false

[[bin]]
name = "journal"
path = "fuzz_targets/journal.rs"
test = false
doc = false
bench = false
